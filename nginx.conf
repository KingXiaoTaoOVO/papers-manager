server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 单文件应用：任何路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查（供 docker healthcheck / 1panel 探活）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 版本清单不缓存，保证更新检测实时生效
    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /version.json =404;
    }

    # 静态资源长缓存（单文件内联，几乎无外部资源）
    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;
}
