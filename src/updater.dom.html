<div id="pm-banner" role="status" aria-live="polite">
  <span class="pm-dot"></span>
  <span class="pm-txt" id="pm-banner-txt"></span>
  <span class="pm-acts">
    <button class="pm-btn" id="pm-banner-notes" type="button"></button>
    <button class="pm-btn primary" id="pm-banner-upd" type="button"></button>
    <button class="pm-btn ghost" id="pm-banner-close" type="button" aria-label="close">&#10005;</button>
  </span>
</div>
<div id="pm-chip" class="ok" title="论文期刊管理器 v5.3.0">
  <span class="pm-sdot"></span><span class="pm-v" id="pm-chip-v">v5.3.0</span><span class="pm-tag" id="pm-chip-tag"></span>
</div>
<div id="pm-pop">
  <h4 id="pm-pop-title"></h4>
  <div class="pm-row"><span class="pm-k" id="pm-k-ver"></span><span class="pm-vv" id="pm-v-ver"></span></div>
  <div class="pm-row"><span class="pm-k" id="pm-k-build"></span><span class="pm-vv" id="pm-v-build"></span></div>
  <div class="pm-row"><span class="pm-k" id="pm-k-repo"></span><span class="pm-vv" id="pm-v-repo"></span></div>
  <div class="pm-row"><span class="pm-k" id="pm-k-img"></span><span class="pm-vv"><code id="pm-v-img"></code></span></div>
  <div class="pm-row"><span class="pm-k" id="pm-k-chk"></span><span class="pm-vv" id="pm-v-chk"></span></div>
  <div class="pm-status" id="pm-status"></div>
  <div class="pm-acts">
    <button class="pm-btn primary" id="pm-btn-chk" type="button"></button>
    <button class="pm-btn" id="pm-btn-copy" type="button"></button>
    <button class="pm-btn" id="pm-btn-repo" type="button"></button>
    <button class="pm-btn" id="pm-btn-panel" type="button"></button>
  </div>
</div>
<div id="pm-modal" role="dialog" aria-modal="true">
  <div class="pm-box">
    <h3 id="pm-modal-title"></h3>
    <div class="pm-sub" id="pm-modal-sub"></div>
    <div class="pm-notes" id="pm-modal-notes"></div>
    <div class="pm-acts">
      <button class="pm-btn" id="pm-modal-close" type="button"></button>
      <button class="pm-btn primary" id="pm-modal-upd" type="button"></button>
    </div>
  </div>
</div>
