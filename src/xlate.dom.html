<!-- ===== 内置 PDF 双语翻译与精读工作台 ===== -->
<div id="pm-xl-chip" title="内置 PDF 双语翻译与精读（Bing 神经网络引擎，无需 Key）">
  <svg class="ico" viewBox="0 0 24 24"><path d="M4 5h7M7.5 5v1c0 4-1.5 8-4 11"/><path d="M5 12c2.5 3 5 4.5 8 5.5"/><path d="M13 20l3.5-8 3.5 8M14.2 17h4.6"/></svg>
  <span class="txt" id="pm-xl-chip-txt">PDF 双语翻译</span>
  <span class="sub" id="pm-xl-chip-sub">内置引擎</span>
</div>

<div id="pm-xl" role="dialog" aria-modal="true" aria-label="PDF 双语翻译与文献精读工作台">
  <div id="pm-xl-box">
    <!-- 顶部工作台导航栏 -->
    <div class="xl-top">
      <div class="xl-brand">
        <div class="xl-brand-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            <path d="M8 7h8M8 11h6"/>
          </svg>
        </div>
        <div>
          <div class="xl-brand-title" id="pm-xl-title">PDF 双语精读与翻译工作台</div>
          <div class="xl-brand-badge"><span class="pulse-dot"></span>Bing 翻译引擎 · 容器内置免 Key · 国内直连</div>
        </div>
      </div>

      <!-- 模式切换 Tabs -->
      <div class="xl-tabs">
        <button class="xl-tab active" id="pm-xl-tab-pdf" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          PDF 文档解析
        </button>
        <button class="xl-tab" id="pm-xl-tab-paste" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          自由文本翻译
        </button>
        <button class="xl-tab" id="pm-xl-tab-paper" type="button" title="载入当前选中的论文摘要与正文">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          当前论文导入
        </button>
      </div>

      <!-- 语言选择与主要操作按钮 -->
      <div class="xl-actions">
        <div class="xl-lang-group">
          <select id="pm-xl-from" title="源语言"></select>
          <span class="xl-arrow">→</span>
          <select id="pm-xl-to" title="目标语言"></select>
        </div>
        <button class="xl-btn primary" id="pm-xl-run" type="button" disabled>
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          开始翻译
        </button>
        <button class="xl-btn" id="pm-xl-stop" type="button" disabled>停止</button>
        <button class="xl-btn" id="pm-xl-clear" type="button">清空</button>
        <button class="xl-btn close-btn" id="pm-xl-close" type="button" title="关闭 (Esc)">✕</button>
      </div>
    </div>

    <!-- 主体左右双栏 -->
    <div class="xl-body">
      <!-- 左栏：原文 -->
      <div class="xl-pane" id="pm-xl-left-pane">
        <div class="xl-pane-bar">
          <span class="xl-pane-title">原文 (SOURCE)</span>
          <span class="xl-pane-badge" id="pm-xl-src-badge">等待载入内容</span>
          <button class="xl-text-btn" id="pm-xl-pick-btn" type="button">选择 PDF</button>
        </div>

        <div class="xl-pane-scroll" id="pm-xl-src-scroll">
          <!-- 模式一：PDF 拖放区（未上传时） -->
          <div class="xl-dropzone" id="pm-xl-drop">
            <div class="xl-drop-icon">
              <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <div class="xl-drop-main">拖入 PDF 论文或点击选择文件</div>
            <div class="xl-drop-sub">支持中英双栏论文，自动解析版面段落、标题与页码</div>
            <div class="xl-drop-tags">
              <span>PDF 智能排版抽取</span>
              <span>单双栏自适应</span>
              <span>免上传云端 本地抽取</span>
            </div>
          </div>

          <!-- 已加载的 PDF 文件信息卡片 -->
          <div class="xl-file-card" id="pm-xl-file-card" style="display:none">
            <div class="xl-file-info">
              <span class="xl-file-name" id="pm-xl-file-name">document.pdf</span>
              <span class="xl-file-meta" id="pm-xl-file-meta">正在解析…</span>
            </div>
            <button class="xl-text-btn danger" id="pm-xl-reselect" type="button">重新选择</button>
          </div>

          <!-- 模式二：文本输入区（粘贴模式或直接输入） -->
          <div class="xl-paste-wrap" id="pm-xl-paste-wrap" style="display:none">
            <textarea id="pm-xl-paste" placeholder="在此直接粘贴或输入需要翻译的论文段落、摘要或英文文本（段落间请保留空行）…"></textarea>
          </div>

          <!-- 原文段落列表展示 -->
          <div class="xl-list" id="pm-xl-src-list"></div>
        </div>
      </div>

      <!-- 右栏：双语对照译文 -->
      <div class="xl-pane" id="pm-xl-right-pane">
        <div class="xl-pane-bar">
          <span class="xl-pane-title">译文 (TRANSLATION)</span>
          <span class="xl-pane-badge" id="pm-xl-dst-badge">等待翻译</span>
          <button class="xl-text-btn" id="pm-xl-copy-all" type="button">复制全译文</button>
        </div>

        <div class="xl-pane-scroll" id="pm-xl-dst-scroll">
          <!-- 空状态提示 -->
          <div class="xl-empty-view" id="pm-xl-dst-empty">
            <div class="xl-empty-icon">
              <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
            </div>
            <div class="xl-empty-title">等待翻译启动</div>
            <div class="xl-empty-desc">在左侧选择 PDF 或粘贴文本后，点击顶部的「开始翻译」按钮，译文将分段同步在此呈现，支持双语并排对照阅读与一键导出 Markdown。</div>
          </div>

          <!-- 译文段落列表展示 -->
          <div class="xl-list" id="pm-xl-dst-list"></div>
        </div>
      </div>
    </div>

    <!-- 底部状态条与统计信息 -->
    <div class="xl-foot">
      <div class="xl-foot-status">
        <span class="xl-status-dot" id="pm-xl-status-dot"></span>
        <span id="pm-xl-status">就绪</span>
      </div>
      <div class="xl-foot-prog">
        <div class="xl-prog-bar"><i id="pm-xl-prog"></i></div>
        <span class="xl-prog-pct" id="pm-xl-pct">0%</span>
      </div>
      <div class="xl-foot-stats">
        <span id="pm-xl-count">0 段落</span>
        <button class="xl-btn sm" id="pm-xl-export" type="button" disabled>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出 Markdown
        </button>
      </div>
    </div>
  </div>

  <input type="file" id="pm-xl-file" accept="application/pdf" style="display:none">
</div>
