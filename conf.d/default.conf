server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    client_max_body_size 200m;

    # 单文件应用：任何路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查（供 docker healthcheck / 1panel 探活）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 版本清单不缓存，保证更新检测实时生效
    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /version.json =404;
    }

    # ===== PDF 双语翻译（pdf2zh WebUI，Gradio 子路径反代）=====
    # 容器内以 GRADIO_ROOT_PATH=/translate 启动，nginx 剥掉前缀转发
    location /translate/ {
        proxy_pass http://pdf2zh:7860/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Gradio 的 queue 走 WebSocket
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # 大 PDF / 长任务：放宽超时与缓冲
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
        proxy_connect_timeout 60s;
        proxy_buffering      off;
        proxy_request_buffering off;
    }

    # 静态资源长缓存（单文件内联，几乎无外部资源）
    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;
}
