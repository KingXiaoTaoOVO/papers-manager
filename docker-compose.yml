# 论文期刊管理器 · Papers Manager（单容器：站点 + 内置学术格式级双语翻译与多人协同）
# 用法一：1Panel → 容器 → 编排 → 创建编排，粘贴本文件内容
# 用法二：docker compose up -d --build
services:
  papers-manager:
    build: .
    container_name: papers-manager
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      # 站点内容、nginx 配置与后端接口外挂，便于热更新与持久化
      - ./html:/usr/share/nginx/html:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./api:/app/api:ro
      - ./data:/app/data
