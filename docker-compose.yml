# 论文期刊管理器 · Papers Manager（站点 + PDF 双语翻译）
# 用法一：1Panel → 容器 → 编排 → 创建编排，粘贴本文件内容
# 用法二：docker compose up -d
services:
  # ---- 站点：单文件应用（nginx 静态托管 + 反代翻译服务）----
  papers-manager:
    image: nginx:1.27-alpine
    container_name: papers-manager
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - pdf2zh

  # ---- PDF 双语翻译：pdf2zh WebUI（官方镜像，免构建）----
  # GRADIO_ROOT_PATH 让它挂在站点 /translate/ 子路径下，无需改镜像
  pdf2zh:
    image: byaidu/pdf2zh:1.9.11
    container_name: pdf2zh
    restart: unless-stopped
    environment:
      - GRADIO_ROOT_PATH=/translator
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - HF_HOME=/data/cache
      - XDG_CACHE_HOME=/data/cache
    volumes:
      - ./pdf2zh-data:/data
    expose:
      - "7860"
